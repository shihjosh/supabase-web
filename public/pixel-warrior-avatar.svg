<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0891b2" />
      <stop offset="1" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="32" height="32" fill="url(#bg-grad)" />

  <!-- 頭盔/頭髮 -->
  <rect x="9" y="4" width="14" height="3" fill="#0f172a" />
  <rect x="8" y="7" width="1" height="6" fill="#0f172a" />
  <rect x="23" y="7" width="1" height="6" fill="#0f172a" />
  <rect x="9" y="7" width="14" height="2" fill="#1e293b" />

  <!-- 臉 -->
  <rect x="9" y="9" width="14" height="9" fill="#f4c99b" />

  <!-- 眼鏡鏡框 -->
  <rect x="9" y="12" width="6" height="4" fill="none" stroke="#0f172a" stroke-width="1" />
  <rect x="17" y="12" width="6" height="4" fill="none" stroke="#0f172a" stroke-width="1" />
  <rect x="15" y="13" width="2" height="1" fill="#0f172a" />
  <rect x="8" y="13" width="1" height="1" fill="#0f172a" />
  <rect x="23" y="13" width="1" height="1" fill="#0f172a" />

  <!-- 鏡片發光青色 -->
  <rect x="10" y="13" width="4" height="2" fill="#22d3ee" opacity="0.85" />
  <rect x="18" y="13" width="4" height="2" fill="#22d3ee" opacity="0.85" />

  <!-- 鼻子陰影 -->
  <rect x="15" y="16" width="2" height="1" fill="#d9a86c" />

  <!-- 嘴巴 -->
  <rect x="13" y="18" width="6" height="1" fill="#7c4a2d" />

  <!-- 護肩 / 裝備 -->
  <rect x="6" y="19" width="4" height="4" fill="#334155" />
  <rect x="22" y="19" width="4" height="4" fill="#334155" />
  <rect x="6" y="19" width="4" height="1" fill="#22d3ee" />
  <rect x="22" y="19" width="4" height="1" fill="#22d3ee" />

  <!-- 胸甲 -->
  <rect x="10" y="19" width="12" height="7" fill="#1e293b" />
  <rect x="10" y="19" width="12" height="2" fill="#334155" />

  <!-- 胸口發光核心 -->
  <rect x="15" y="21" width="2" height="2" fill="#fb923c" />
  <rect x="14" y="22" width="4" height="1" fill="#fb923c" opacity="0.6" />

  <!-- 護甲紋路 -->
  <rect x="10" y="24" width="12" height="1" fill="#0f172a" />

  <!-- 底部掃描線科技感裝飾 -->
  <rect x="0" y="30" width="32" height="1" fill="#22d3ee" opacity="0.4" />
  <rect x="0" y="0" width="32" height="1" fill="#22d3ee" opacity="0.25" />
</svg>
